<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet"><title>Elenco – Eternus FC</title><link rel="stylesheet" href="assets/style.css"></head><body>
<header id="nav"></header>
<main><h2>Elenco</h2><div id="lista"><p class="vazio">Carregando…</p></div></main>
<footer>© Eternus FC</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="assets/config.js"></script><script src="assets/app.js"></script><script>
nav(false,'elenco');
(async()=>{
  const {data,error}=await sb.from('jogadores').select('*').eq('ativo',true).order('numero',{nullsFirst:false});
  const el=document.getElementById('lista');
  if(error) return el.innerHTML='<p class="vazio">Não foi possível carregar o elenco.</p>';
  if(!data.length) return el.innerHTML='<p class="vazio">Elenco em breve.</p>';
  el.innerHTML=POSICOES.map(p=>{const js=data.filter(j=>j.posicao===p);
    return js.length?'<section class="grupo"><h2>'+p+(p==='Técnico'?'':'s')+'</h2><div class="grid">'+js.map(cartaoJogador).join('')+'</div></section>':''}).join('');
})();
</script></body></html>
