<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><title>Elenco – Eternus FC</title><link rel="stylesheet" href="assets/style.css"></head><body>
<header id="nav"></header>
<main><h2>Elenco</h2><div id="lista" class="grid"><p class="vazio">Carregando…</p></div></main>
<div class="modal" id="mdet" hidden><div class="painel" id="pdet"></div></div>
<footer><a href="admin/index.html">Admin</a></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="assets/config.js"></script><script src="assets/app.js"></script><script>
nav(false,'elenco');
let J=[];
(async()=>{
  const {data,error}=await sb.from('jogadores').select('*').eq('ativo',true).order('numero',{nullsFirst:false});
  if(error) return lista.innerHTML='<p class="vazio">Não foi possível carregar o elenco.</p>';
  J=data;
  lista.innerHTML=J.length?J.map(cartaoJogador).join(''):'<p class="vazio">Elenco em breve.</p>';
})();
lista.onclick=e=>{const c=e.target.closest('.card');if(!c)return;pdet.innerHTML=detalhesJogador(J.find(x=>x.id==c.dataset.id));abrirModal('mdet')};
</script></body></html>
