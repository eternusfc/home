<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet"><title>Contato – Admin Eternus FC</title><link rel="stylesheet" href="../assets/style.css"></head><body>
<header id="nav"></header>
<main><h2>Editar contato</h2>
<form id="f" class="box">
<label>WhatsApp<input id="whatsapp" placeholder="(11) 91234-5678"></label>
<label>Telefone<input id="telefone"></label>
<label>E-mail<input id="email" type="email"></label>
<label>Instagram<input id="instagram" placeholder="eternusfc"></label>
<label>Local dos jogos<input id="endereco" placeholder="Ginásio, rua, cidade"></label>
<label>Dias e horários de treino<textarea id="treinos" rows="2"></textarea></label>
<button class="btn">Salvar contato</button>
</form></main><div id="aviso" class="aviso" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="../assets/config.js"></script><script src="../assets/app.js"></script><script>
nav(true,'contato');
const campos=['whatsapp','telefone','email','instagram','endereco','treinos'];
exigeLogin().then(async()=>{
  const {data,error}=await sb.from('contato').select('*').eq('id',1).maybeSingle();
  if(error) return aviso('Erro ao carregar: '+error.message,true);
  if(data) campos.forEach(c=>document.getElementById(c).value=data[c]??'');
});
f.onsubmit=async e=>{e.preventDefault();
  const d={id:1};campos.forEach(c=>d[c]=document.getElementById(c).value.trim()||null);
  const {error}=await sb.from('contato').upsert(d);
  error?aviso('Erro ao salvar: '+error.message,true):aviso('Contato salvo.')};
</script></body></html>
