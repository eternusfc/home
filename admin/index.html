<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><title>Entrar – Admin Eternus FC</title><link rel="stylesheet" href="../assets/style.css?v=1793123906"></head><body>
<div class="login"><form id="f"><h1>Eternus FC · Admin</h1>
<label>E-mail<input type="email" id="email" required autocomplete="username"></label>
<label>Senha<input type="password" id="senha" required autocomplete="current-password"></label>
<button class="btn">Entrar</button><a href="../index.html">Voltar ao site</a></form></div>
<div id="aviso" class="aviso" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="../assets/config.js?v=1793123906"></script><script src="../assets/app.js?v=1793123906"></script><script>
usuarioLogado().then(u=>{if(u)location.replace('elenco.html')});
f.onsubmit=async e=>{e.preventDefault();
  const {error}=await sb.auth.signInWithPassword({email:email.value,password:senha.value});
  error?aviso('E-mail ou senha incorretos.',true):location.replace('elenco.html')};
</script></body></html>
