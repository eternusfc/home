<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><title>Elenco – Admin Eternus FC</title><link rel="stylesheet" href="../assets/style.css?v=1793123906"></head><body>
<header id="nav"></header>
<main><div class="topo"><h2>Elenco</h2><button class="btn" id="novo">Adicionar jogador</button></div>
<ul class="lista" id="lista"></ul></main>

<div class="modal" id="m" hidden><form class="painel" id="f">
  <div class="painel-topo"><h3 id="titulo">Novo jogador</h3><button type="button" class="x" data-fechar aria-label="Fechar">×</button></div>
  <div class="painel-corpo">
    <div class="foto-campo"><span class="vazia" id="prev"></span><label class="btn sec mini">Escolher foto<input id="foto" type="file" accept="image/*"></label></div>
    <label>Nome<input id="nome" required autocomplete="off"></label>
    <div class="par"><label>Número<input id="numero" type="number" min="0" max="99" inputmode="numeric"></label>
    <label>Idade<input id="idade" type="number" min="10" max="70" inputmode="numeric"></label>
    <label>Altura (cm)<input id="altura" type="number" min="120" max="230" inputmode="numeric"></label></div>
    <div class="par dois"><label>Posição<select id="posicao"></select></label>
    <label>Pé dominante<select id="pe"><option value="">—</option></select></label></div>
    <label class="chk"><input id="ativo" type="checkbox" checked> Aparece no site</label>
    <label class="chk"><input id="isento" type="checkbox"> Isento de mensalidade</label>
  </div>
  <div class="painel-rodape"><button type="button" class="btn sec" data-fechar>Cancelar</button><button class="btn" id="salvar">Salvar</button></div>
</form></div>
<div id="aviso" class="aviso" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="../assets/config.js?v=1793123906"></script><script src="../assets/app.js?v=1793123906"></script><script>
nav(true,'elenco');
let lista_=[],atual=null;
posicao.innerHTML=POSICOES.map(p=>'<option>'+p+'</option>').join('');
pe.innerHTML+=PES.map(p=>'<option>'+p+'</option>').join('');
function previa(url){prev.outerHTML=url?'<img id="prev" alt="" src="'+esc(url)+'">':'<span class="vazia" id="prev"></span>'}
foto.onchange=()=>{const a=foto.files[0];previa(a?URL.createObjectURL(a):atual?.foto_url)};
const num=el=>el.value===''?null:+el.value;

async function carregar(){
  const {data,error}=await sb.from('jogadores').select('*').order('numero',{nullsFirst:false});
  if(error) return aviso('Erro ao carregar: '+error.message,true);
  lista_=data;
  lista.innerHTML=data.length?data.map(j=>'<li class="'+(j.ativo?'':'oculto')+'">'+(j.foto_url?'<img src="'+esc(j.foto_url)+'" alt="">':'<div class="ini">'+esc(iniciais(j.nome))+'</div>')+'<div class="nome">'+esc(j.nome)+'<small>'+(j.numero!=null?'#'+j.numero+' · ':'')+esc(j.posicao)+(j.ativo?'':' · oculto')+(j.isento?' · isento':'')+'</small></div><button class="btn mini sec" data-e="'+j.id+'">Editar</button><button class="btn mini perigo" data-d="'+j.id+'">Excluir</button></li>').join(''):'<p class="vazio">Nenhum jogador ainda. Toque em “Adicionar jogador”.</p>';
}
function abrir(j){
  atual=j||null;f.reset();foto.value='';titulo.textContent=j?'Editar jogador':'Novo jogador';
  nome.value=j?.nome??'';numero.value=j?.numero??'';idade.value=j?.idade??'';altura.value=j?.altura_cm??'';
  pe.value=j?.pe_dominante??'';posicao.value=j?.posicao??'Ala';ativo.checked=j?j.ativo:true;isento.checked=!!j?.isento;previa(j?.foto_url);abrirModal('m');
}
novo.onclick=()=>abrir(null);

f.onsubmit=async e=>{e.preventDefault();
  salvar.disabled=true;
  try{
    const d={nome:nome.value.trim(),numero:num(numero),idade:num(idade),altura_cm:num(altura),pe_dominante:pe.value||null,posicao:posicao.value,ativo:ativo.checked,isento:isento.checked,foto_url:atual?.foto_url??null};
    let novoCaminho=null;
    if(foto.files[0]){
      const blob=await comprimir(foto.files[0]);
      novoCaminho='jogadores/'+crypto.randomUUID()+'.jpg';
      const up=await sb.storage.from('fotos').upload(novoCaminho,blob,{contentType:'image/jpeg'});
      if(up.error) throw up.error;
      d.foto_url=sb.storage.from('fotos').getPublicUrl(novoCaminho).data.publicUrl;
    }
    const {error}=atual?await sb.from('jogadores').update(d).eq('id',atual.id):await sb.from('jogadores').insert(d);
    if(error){if(novoCaminho) await sb.storage.from('fotos').remove([novoCaminho]);throw error}
    const antigo=novoCaminho&&caminhoFoto(atual?.foto_url);
    if(antigo) await sb.storage.from('fotos').remove([antigo]);
    aviso(atual?'Jogador atualizado.':'Jogador adicionado.');fecharModal('m');carregar();
  }catch(err){aviso('Erro ao salvar: '+err.message,true)}
  salvar.disabled=false};

lista.onclick=async e=>{
  const ed=e.target.dataset.e,del=e.target.dataset.d;
  if(ed) abrir(lista_.find(x=>x.id==ed));
  if(del&&confirm('Excluir este jogador?')){
    const j=lista_.find(x=>x.id==del),{error}=await sb.from('jogadores').delete().eq('id',del);
    if(error) return aviso('Erro ao excluir: '+error.message,true);
    const c=caminhoFoto(j.foto_url);if(c) await sb.storage.from('fotos').remove([c]);
    aviso('Jogador excluído.');carregar()}};
exigeLogin().then(carregar);
</script></body></html>
